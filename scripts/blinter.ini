# Blinter configuration for scripts/install_blinter.cmd and scripts/uninstall_blinter.cmd
# Lint with: py -m blinter scripts --no-recursive --config scripts/blinter.ini
#
# fail_on = style makes every finding fail this lint. Suppress one line with
# REM LINT:IGNORE <code> in the script. Suppress a rule for both scripts with
# disabled_rules in the [rules] section.

[general]
max_line_length = 120
show_summary = false
fail_on = style
