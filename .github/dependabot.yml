version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # CodeQL fails when its steps are not all on the same version.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
