name: Blinter benchmark

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
    inputs:
      blinter_version:
        description: "Blinter version to test, e.g. 1.1.47 (blank = latest PyPI + latest GitHub release)"
        required: false
        default: ""
      runs:
        description: "Timed runs per workload (more = less noise, slower)"
        required: false
        default: "20"
      warmup:
        description: "Discarded warm-up runs per workload"
        required: false
        default: "3"

permissions:
  contents: read
  actions: write

concurrency:
  group: blinter-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  BLINTER_VERSION: ${{ inputs.blinter_version || '' }}
  BENCH_RUNS: ${{ inputs.runs || '20' }}
  BENCH_WARMUP: ${{ inputs.warmup || '3' }}

jobs:
  bench-python:
    name: python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-2022, windows-11-arm]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false

      - name: Benchmark pip and uv installs
        run: >
          python scripts/benchmark.py
          --mode python
          --label ${{ matrix.os }}
          --python-label ${{ matrix.python }}
          --out out/result-${{ matrix.os }}-py${{ matrix.python }}.json

      - name: Upload results
        if: "${{ !cancelled() }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-${{ matrix.os }}-py${{ matrix.python }}
          path: out/result-${{ matrix.os }}-py${{ matrix.python }}.json
          if-no-files-found: error
          retention-days: 30

  bench-exe:
    name: exe · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Benchmark standalone exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python scripts/benchmark.py
          --mode exe
          --label ${{ matrix.os }}
          --out out/result-${{ matrix.os }}-exe.json

      - name: Upload results
        if: "${{ !cancelled() }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-${{ matrix.os }}-exe
          path: out/result-${{ matrix.os }}-exe.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: Build report
    needs: [bench-python, bench-exe]
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Build report
        shell: bash
        run: |
          python scripts/report.py results report
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-report
          path: report/
          if-no-files-found: error
          retention-days: 90
