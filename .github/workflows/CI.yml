name: CI

# Single pipeline for CI and release on main. Release jobs use needs (not workflow_run).
# CodeQL runs here; keep GitHub default CodeQL setup disabled (Settings > Code security).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run quality checks
        run: |
          python scripts/spec/validate_spec.py
          python scripts/spec/validate_corpus.py
          python scripts/spec/generate_rules.py --check
          python scripts/spec/generate_expansion.py --check
          python scripts/spec/generate_commands.py --check
          python scripts/spec/generate_docs.py --check
          python scripts/spec/audit_ssot.py --strict
          python -m black --check src tests scripts
          python -m isort --check-only src tests scripts
          python -m mypy src/blinter tests scripts/verify.py scripts/corpus_lint.py scripts/corpus_baseline.py scripts/generate_corpus_baseline.py scripts/benchmark_lint.py
          python -m mypy scripts/build_exe.py
          python -m pylint src/blinter
          python -m bandit -r src/blinter -c pyproject.toml -ll -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt
          python scripts/benchmark_lint.py --runs 3 --check-baseline

  quality-windows:
    name: PowerShell and install-script lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run cmd.exe corpus oracle
        run: python scripts/spec/cmd_oracle.py

      - name: Run PowerShell verification checks
        run: python scripts/verify.py --powershell-only

  test-python:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        # batch-script-examples/ is not checked out in CI; @pytest.mark.needs_corpus
        # tests skip automatically when that folder is absent.
        run: python -m pytest

  test-windows-exe:
    name: Windows executable smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Create virtual environment
        run: uv venv venv

      - name: Install dependencies in virtual environment
        run: |
          .\venv\Scripts\Activate.ps1
          uv pip install --upgrade setuptools
          uv pip install --upgrade wheel
          uv pip install --upgrade nuitka
          $env:CHARSET_NORMALIZER_USE_MYPYC = "0"
          uv pip install --upgrade -r requirements.txt --no-binary charset-normalizer
        shell: pwsh

      - name: Build executable
        run: |
          .\venv\Scripts\Activate.ps1
          python scripts/build_exe.py
        shell: pwsh

      - name: Verify executable exists
        run: |
          if (-not (Test-Path -Path "dist\blinter.exe" -PathType Leaf)) {
            throw "dist\blinter.exe was not produced by Nuitka"
          }
        shell: pwsh

      - name: Install Blinter for parity checks
        run: |
          .\venv\Scripts\Activate.ps1
          uv pip install -e .
        shell: pwsh

      - name: Smoke test executable
        run: .\scripts\test_exe_smoke.ps1 -ExePath .\dist\blinter.exe
        shell: pwsh

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  dependency-graph:
    name: Dependency Graph
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Submit dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.6
        with:
          detectorArgs: Pip=EnableIfDefaultOff

  check-version:
    name: Check pyproject.toml version bump
    needs:
      - quality
      - quality-windows
      - test-python
      - test-windows-exe
      - codeql
      - dependency-graph
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: true
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import pathlib; p=pathlib.Path('pyproject.toml'); print(next(l.split('=',1)[1].strip().strip('\"').strip(\"'\") for l in p.read_text().splitlines() if l.strip().startswith('version = ')))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Decide whether to release
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch; releasing version ${{ steps.version.outputs.version }}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(python -c "
          import pathlib, subprocess, sys
          text = subprocess.check_output(['git', 'show', 'HEAD^:pyproject.toml'], text=True)
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith('version = '):
                  print(stripped.split('=', 1)[1].strip().strip('\"').strip(\"'\"))
                  break
          else:
              sys.exit('Could not read previous version from pyproject.toml')
          ")
          NEW_VERSION="${{ steps.version.outputs.version }}"
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Version unchanged ($NEW_VERSION); skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped: $OLD_VERSION -> $NEW_VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "pyproject.toml" -Pattern '^version = "(.+)"'
          if (-not $match) { throw "Could not read version from pyproject.toml" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Create virtual environment
        run: uv venv venv

      - name: Install dependencies in virtual environment
        run: |
          .\venv\Scripts\Activate.ps1
          uv pip install --upgrade setuptools
          uv pip install --upgrade wheel
          uv pip install --upgrade nuitka
          $env:CHARSET_NORMALIZER_USE_MYPYC = "0"
          uv pip install --upgrade -r requirements.txt --no-binary charset-normalizer
        shell: pwsh

      - name: Build executable
        run: |
          .\venv\Scripts\Activate.ps1
          python scripts/build_exe.py
        shell: pwsh

      - name: Package executable for release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folder = "dist/Blinter-v$version"
          New-Item -ItemType Directory -Path $folder -Force
          Move-Item -Path dist/blinter.exe -Destination "$folder/blinter.exe"
          Compress-Archive -Path $folder -DestinationPath "dist/Blinter-v$version.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/Blinter-v${{ steps.version.outputs.version }}.zip

  build-wheels:
    name: Build Python wheels
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Build pure Python wheel and sdist
        run: uv build

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  create-release:
    needs: [check-version, build-windows]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./build

      - name: Extract release notes
        id: release_notes
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          python scripts/extract_release_notes.py > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./build/Blinter-v${{ needs.check-version.outputs.version }}.zip
          tag: v${{ needs.check-version.outputs.version }}
          bodyFile: ${{ steps.release_notes.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          removeArtifacts: true

  publish-pypi:
    name: Publish wheels to PyPI
    needs: [check-version, build-wheels]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_BLINTER }}
        run: |
          uvx twine check dist/*
          uvx twine upload dist/*
