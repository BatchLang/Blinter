name: CI

# Single pipeline for CI and release on main. Release jobs use needs (not workflow_run).
# CodeQL runs here; keep GitHub default CodeQL setup disabled (Settings > Code security).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run quality checks
        run: python scripts/verify.py --skip-pytest

  quality-windows:
    name: PowerShell, installer, and uninstaller
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Windows verification checks
        run: python scripts/verify.py --windows-only

      - name: Run installer and uninstaller
        timeout-minutes: 15
        shell: powershell
        run: .\scripts\test_install_scripts.ps1

  quality-unix:
    name: Shell installer and uninstaller (${{ matrix.os_name }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            arch: x64
            runner: ubuntu-24.04
          - os_name: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os_name: macOS
            arch: arm64
            runner: macos-15
          - os_name: macOS
            arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.os_name }}-${{ matrix.arch }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint shell scripts
        run: shellcheck scripts/install_blinter.sh scripts/uninstall_blinter.sh scripts/test_install_scripts.sh

      - name: Run installer and uninstaller
        timeout-minutes: 15
        run: /bin/bash scripts/test_install_scripts.sh ${{ matrix.arch }}

  test-python:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15, macos-15-intel, windows-latest, windows-2022, windows-11-arm]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        # batch-script-examples/ is not checked out in CI; @pytest.mark.needs_corpus
        # tests skip automatically when that folder is absent.
        run: python -m pytest

  test-windows-exe:
    name: Windows executable smoke tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.arch }}
          activate-environment: true

      - name: Install Nuitka build dependencies
        env:
          CHARSET_NORMALIZER_USE_MYPYC: "0"
        run: |
          uv venv venv --python 3.14
          uv pip install --python venv setuptools==84.2.1
          uv pip install --python venv nuitka==4.3.1
          uv pip install --python venv --upgrade -r requirements.txt --no-binary charset-normalizer
          uv pip install --python venv -e .

      - name: Build executable
        run: .\venv\Scripts\python.exe scripts/build_exe.py

      - name: Smoke test executable
        env:
          BLINTER_EXPECTED_ARCH: ${{ matrix.arch }}
        run: .\venv\Scripts\python.exe scripts/test_exe_smoke.py

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-exe-${{ matrix.arch }}
          path: dist/blinter.exe
          if-no-files-found: error

  test-unix-exe:
    name: Unix executable smoke tests (${{ matrix.os_name }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.39 floor: oldest supported GitHub Ubuntu images.
          - os_name: Linux
            arch: x64
            runner: ubuntu-24.04
          - os_name: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os_name: macOS
            arch: arm64
            runner: macos-15
          - os_name: macOS
            arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.os_name }}-${{ matrix.arch }}
          activate-environment: true

      - name: Install ccache
        # Nuitka's gcc build warns when ccache is missing. The macOS runners
        # already provide it.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Install Nuitka build dependencies
        env:
          CHARSET_NORMALIZER_USE_MYPYC: "0"
        run: |
          uv venv venv --python 3.14
          uv pip install --python venv setuptools==84.2.1
          uv pip install --python venv nuitka==4.3.1
          uv pip install --python venv --upgrade -r requirements.txt --no-binary charset-normalizer
          uv pip install --python venv -e .

      - name: Build executable
        run: ./venv/bin/python scripts/build_exe.py

      - name: Smoke test executable
        env:
          BLINTER_EXPECTED_ARCH: ${{ matrix.arch }}
        run: ./venv/bin/python scripts/test_exe_smoke.py

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unix-exe-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/blinter
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{matrix.language}}"

  dependency-graph:
    name: Dependency Graph
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Submit dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@b282c67b1008fde9b60da4bdfcd8849613e293b2 # v0.1.6
        with:
          detectorArgs: Pip=EnableIfDefaultOff

  check-version:
    name: Check pyproject.toml version bump
    needs:
      - quality
      - quality-windows
      - quality-unix
      - test-python
      - test-windows-exe
      - test-unix-exe
      - codeql
      - dependency-graph
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: true
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Read version from pyproject.toml
        id: version
        run: python scripts/ci_release.py version

      - name: Decide whether to release
        id: check
        run: python scripts/ci_release.py should-release

  build-windows:
    name: Package Windows executable (${{ matrix.arch }})
    needs: [check-version, test-windows-exe]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false
          activate-environment: true

      - name: Download executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-exe-${{ matrix.arch }}
          path: dist

      - name: Package executable
        env:
          BLINTER_OS_NAME: Windows
          BLINTER_ARCH: ${{ matrix.arch }}
        run: python scripts/package_executable.py

      - name: Attest Windows zip
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/Blinter-v${{ needs.check-version.outputs.version }}-Windows-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build-${{ matrix.arch }}
          path: dist/Blinter-v${{ needs.check-version.outputs.version }}-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-unix:
    name: Package ${{ matrix.os_name }} executable (${{ matrix.arch }})
    needs: [check-version, test-unix-exe]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            arch: x64
            runner: ubuntu-24.04
          - os_name: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os_name: macOS
            arch: arm64
            runner: macos-15
          - os_name: macOS
            arch: x64
            runner: macos-15-intel
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false
          activate-environment: true

      - name: Download executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unix-exe-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist

      - name: Package executable
        env:
          BLINTER_OS_NAME: ${{ matrix.os_name }}
          BLINTER_ARCH: ${{ matrix.arch }}
        run: python scripts/package_executable.py

      - name: Attest archive
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/Blinter-v${{ needs.check-version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.os_name == 'Linux' && 'linux' || 'macos' }}-build-${{ matrix.arch }}
          path: dist/Blinter-v${{ needs.check-version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build Python wheels
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Build pure Python wheel and sdist
        run: uv build

      - name: Attest Python distributions
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*

      - name: Store artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist
          path: dist/

  create-release:
    needs: [check-version, build-windows, build-unix]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "*-build-*"
          merge-multiple: true
          path: ./build

      - name: Extract release notes
        id: release_notes
        run: python scripts/extract_release_notes.py --github-output

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          NOTES_FILE: ${{ steps.release_notes.outputs.path }}
        run: python scripts/publish_github_release.py

  publish-pypi:
    name: Publish wheels to PyPI
    needs: [check-version, build-wheels]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_BLINTER }}
        run: |
          uvx --from twine==7.0.0 twine check dist/*
          uvx --from twine==7.0.0 twine upload dist/*
