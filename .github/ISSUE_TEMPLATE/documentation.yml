name: Documentation issue
description: Something in the docs or README is missing, unclear or wrong
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: A link, file path or section name (README.md, a file under docs/, a rule description, or the `--help` text).
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: What kind of problem?
      options:
        - Incorrect or outdated information
        - Missing information
        - Unclear or confusing
        - Typo or formatting
        - Rule description or example is wrong
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong and what would you expect to see instead?
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request to fix this.
