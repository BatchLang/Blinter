[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.1,<0.14" ]

[project]
name = "blinter"
version = "1.1.44"
description = """\
  Blinter is a linter for Windows batch files. It provides comprehensive static analysis to identify syntax errors, \
  security vulnerabilities, performance issues and style problems.\
  """
readme = "README.md"
keywords = [
  "analysis",
  "bat",
  "batch",
  "batch-file",
  "batch-script",
  "batchfile",
  "cmd",
  "lint",
  "linter",
  "linting",
  "python",
  "script",
  "script-analysis",
  "static",
  "static-analysis",
  "windows",
]
license = "AGPL-3.0-or-later"
license-files = [ "COPYING" ]
maintainers = [ { name = "tboy1337", email = "BatchLang@proton.me" } ]
authors = [ { name = "tboy1337", email = "BatchLang@proton.me" } ]
requires-python = ">=3.11,<3.16"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [ "charset-normalizer>=3.5.2,<4" ]
optional-dependencies.dev = [
  "autopep8",
  "bandit",
  "black",
  "hypothesis",
  "isort",
  "jsonschema",
  "mypy",
  "pip-audit",
  "pylint",
  "pyproject-fmt",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-timeout",
  "pytest-xdist",
  "pyyaml",
  "types-pyyaml",
]
urls.Documentation = "https://github.com/BatchLang/Blinter"
urls.Homepage = "https://github.com/BatchLang/Blinter"
urls.Issues = "https://github.com/BatchLang/Blinter/issues"
urls.Repository = "https://github.com/BatchLang/Blinter.git"
scripts.blinter = "blinter.cli.main:main"

[tool.uv]
package = true
build-backend.wheel-exclude = [ "_build_version.pyi" ]

[tool.black]
target-version = [ "py311", "py312", "py313", "py314", "py315" ]
line-length = 88

[tool.isort]
profile = "black"
atomic = true
line_length = 88
force_sort_within_sections = true
lexicographical = true
combine_as_imports = true
known_first_party = [ "blinter" ]
src_paths = [ "scripts", "src", "tests" ]
skip_gitignore = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.bandit]
exclude_dirs = [ ".venv", "build", "dist", "tests", "venv" ]
# B101: assert used in tests only (tests excluded above)
# B108: hardcoded temp paths in SEC007 scan patterns, not runtime file I/O
skips = [ "B101", "B108" ]
