[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "Blinter"
version = "1.1.35"
description = """\
  Blinter is a linter for Windows batch files. It provides comprehensive static analysis to identify syntax errors, \
  security vulnerabilities, performance issues and style problems.\
  """
readme = "README.md"
keywords = [
  "analysis",
  "bat",
  "batch",
  "batch-file",
  "batch-script",
  "batchfile",
  "cmd",
  "lint",
  "linter",
  "linting",
  "python",
  "script",
  "script-analysis",
  "static",
  "static-analysis",
  "windows",
]
license = "AGPL-3.0-or-later"
license-files = [ "COPYING" ]
maintainers = [ { name = "tboy1337", email = "BatchLang@proton.me" } ]
authors = [ { name = "tboy1337", email = "BatchLang@proton.me" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
dependencies = [ "charset-normalizer" ]
optional-dependencies.dev = [
  "autopep8",
  "bandit",
  # Code Formatting
  "black",
  "isort",
  "jsonschema",
  "mypy",
  # Security Analysis
  "pip-audit",
  # Linting
  "pylint",
  "pyproject-fmt",
  # Core Testing Packages
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-timeout",
  "pytest-xdist",
  # SSOT spec tooling
  "pyyaml",
  "types-pyyaml",
]
urls.Documentation = "https://github.com/BatchLang/Blinter"
urls.Homepage = "https://github.com/BatchLang/Blinter"
urls.Issues = "https://github.com/BatchLang/Blinter/issues"
urls.Repository = "https://github.com/BatchLang/Blinter.git"
scripts.blinter = "blinter.cli.main:main"

[tool.setuptools]
packages.find.where = [ "src" ]
include-package-data = true
package-data.blinter = [ "py.typed" ]
exclude-package-data.blinter = [ "_build_version.pyi" ]
data-files."share/doc/blinter" = [
  "docs/Architecture.md",
  "docs/Batch-File-Linter-Requirements.md",
]

[tool.uv]
package = true

[tool.black]
target-version = [ "py311", "py312", "py313", "py314" ]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
atomic = true
color_output = false
quiet = false
verbose = false
line_length = 88
multi_line_output = 3
balanced_wrapping = true
use_parentheses = true
include_trailing_comma = true
force_single_line = false
force_grid_wrap = 0
single_line_exclusions = [ "typing" ]
force_sort_within_sections = true
lexicographical = true
order_by_type = true
ensure_newline_before_comments = true
lines_between_types = 1
combine_as_imports = true
combine_star = false
from_first = false
sections = [ "FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER" ]
default_section = "THIRDPARTY"
known_first_party = [ "blinter" ]
src_paths = [ "scripts", "src", "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.bandit]
exclude_dirs = [ ".venv", "build", "dist", "tests", "venv" ]
# B101: assert used in tests only (tests excluded above)
# B108: hardcoded temp paths in SEC007 scan patterns, not runtime file I/O
skips = [ "B101", "B108" ]
