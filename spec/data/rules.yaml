  name: IF clause with pseudo AND/OR operator
  severity: WARNING
  explanation: cmd.exe has no AND or OR operator in IF conditional clauses; AND/OR are treated as command separators, causing runtime errors or unintended command execution
  recommendation: Use nested IF statements to combine conditions (for example IF %A% EQU 1 IF %B% EQU 2 ...)
  checker: regex
- code: W057
  name: Batch file invoked without CALL
  severity: WARNING
  explanation: Invoking a .bat or .cmd file without CALL transfers control to the child script; lines after the invocation never run when the child exits
  recommendation: Use CALL helper.bat (or CALL "path\\helper.cmd") so control returns to the caller
  checker: regex
- code: W058
  name: REN destination includes a path
  severity: WARNING
  explanation: REN and RENAME rename files in place; the second argument must be a new filename only, not a path (cmd.exe reports a syntax error)
  recommendation: Use MOVE to relocate a file, or REN with a filename only in the second argument
  checker: regex
- code: W059
  name: FOR loop variable case mismatch
  severity: WARNING
  explanation: FOR loop variables are case-sensitive; %%i and %%I are distinct variables
  recommendation: Use the same letter case as declared in the FOR statement (e.g. %%i if declared as %%i)
  checker: regex
- code: W060
  name: SETX uses equals sign instead of space
  severity: WARNING
  explanation: SETX uses space-delimited syntax (var value), not SET-style equals; SETX MYVAR=value is invalid cmd.exe syntax
  recommendation: Use SETX MYVAR value with a space between the variable name and value
  checker: regex
- code: W061
  name: Unbalanced PUSHD and POPD commands
  severity: WARNING
  explanation: PUSHD and POPD maintain a directory stack; unmatched PUSHD calls can leave temporary network drive letters mapped after the script exits
  recommendation: Pair each PUSHD with a matching POPD, including on error paths, before the script ends
  checker: regex
- code: W062
  name: CD without /D for cross-drive path
  severity: WARNING
  explanation: CD and CHDIR without /D change the stored directory on the target drive but do not switch the active drive; scripts remain on the current drive
  recommendation: Use CD /D path or CHDIR /D path to change both drive and directory in one step
  checker: regex
- code: W063
  name: FOR /F loop variable beyond tokens range
  severity: WARNING
  explanation: FOR /F assigns implicit loop variables in alphabetical order from the declared variable; references beyond the tokens= count resolve as literal percent text (for example %%d becomes %d when only tokens=1-3 is declared, %%b becomes %b with tokens=*, or %%c with tokens=2* when only %%a and %%b are assigned)
  recommendation: Declare enough tokens in the tokens= clause or reference only variables within the assigned range; for multiline DO blocks, check every line in the block body
  checker: regex
- code: W064
  name: ALLUSERPROFILE environment-variable typo
  severity: WARNING
  explanation: ALLUSERPROFILE is a common misspelling of ALLUSERSPROFILE and expands empty
  recommendation: Use %ALLUSERSPROFILE%
  checker: regex
  examples:
    bad:
      - echo %ALLUSERPROFILE%
    good:
      - echo %ALLUSERSPROFILE%
- code: W065
  name: Wildcard in IF string comparison
  severity: WARNING
  explanation: IF == comparisons are literal string matches; * and ? are not glob wildcards there
  recommendation: Use FOR, FINDSTR, or an explicit list of comparisons instead of * or ? in IF ==
  checker: regex
  examples:
    bad:
      - 'IF "%var%"=="foo*" echo match'
    good:
      - echo %var% | FINDSTR /B foo
- code: W066
  name: 2>&1 not at the end of the command
  severity: WARNING
  explanation: 'Stream merge 2>&1 applies to the redirection state at that point; placing it before other redirects often fails to capture stderr as intended'
  recommendation: 'Put 2>&1 at the end of the command, for example DIR >log.txt 2>&1'
  checker: regex
  examples:
    bad:
      - DIR 2>&1 >log.txt
    good:
      - DIR >log.txt 2>&1
- code: W067
  name: SET of a system environment variable
  severity: WARNING
  explanation: Assigning PATH, USERNAME, USERPROFILE, TEMP, TMP, APPDATA, and similar system variables changes the process environment for the rest of the script and child processes
  recommendation: Prefer a distinct variable name, or restore the original value if a temporary override is required
  checker: regex
  examples:
    bad:
      - set USERNAME=demo
    good:
      - set SCRIPT_USER=demo
- code: W068
  name: Percent expansion of a variable set in the same parenthesized block
  severity: WARNING
  explanation: 'cmd.exe expands %var% when a parenthesized block is parsed, so SET inside the block does not update later %var% on that same parse'
  recommendation: Use !var! with SETLOCAL EnableDelayedExpansion, or SET the variable before the block
  checker: regex
  examples:
    bad:
      - |-
        if 1==1 (
          set price=$350
          echo %price%
        )
    good:
      - |-
        setlocal EnableDelayedExpansion
        if 1==1 (
          set price=$350
          echo !price!
        )
- code: W069
  name: TIME expansion without replacing the leading space
  severity: WARNING
  explanation: 'Before 10:00, %TIME% begins with a space rather than a zero, which breaks concatenations, filenames, and colon/dot stripping'
  recommendation: 'Substitute the leading space with %TIME: =0% before using TIME in names or further replacements'
  checker: regex
  examples:
    bad:
      - set stamp=%TIME%
    good:
      - 'set stamp=%TIME: =0%'
- code: W070
  name: SET PATH or PROMPT chained with AND in a .bat file
  severity: WARNING
  explanation: 'In .bat files SET, PATH, and PROMPT do not reset ERRORLEVEL to 0 on success, so cmd1 && cmd2 may skip the second command; .cmd files do reset it'
  recommendation: 'Avoid && after SET, PATH, or PROMPT in .bat files; use a separate line, or rename the script to .cmd'
  checker: regex
  examples:
    bad:
      - set foo=bar && echo ok
    good:
      - |-
        set foo=bar
        echo ok
- code: W071
  name: Parse-time pseudo-variable inside a parenthesized block
  severity: WARNING
  explanation: 'cmd.exe expands %errorlevel%, %random%, %time%, and %date% once when it parses a parenthesized block, so later commands in that block do not update them'
  recommendation: 'Use !errorlevel!, !random!, !time!, or !date! with SETLOCAL EnableDelayedExpansion, or test IF ERRORLEVEL outside the block'
  checker: regex
  examples:
    bad:
      - |-
        if exist folder (
          rmdir /s /q folder
          if %errorlevel% equ 0 echo removed
        )
    good:
      - |-
        setlocal EnableDelayedExpansion
        if exist folder (
          rmdir /s /q folder
          if !errorlevel! equ 0 echo removed
        )
