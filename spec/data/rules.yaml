version: 1
rules:
- code: E001
  name: Nested parentheses mismatch
  severity: ERROR
  explanation: Batch scripts have improper nesting or mismatched parentheses which will cause syntax errors
  recommendation: Ensure all opening parentheses have matching closing parentheses and are properly nested
  checker: regex
- code: E002
  name: Missing label for GOTO statement
  severity: ERROR
  explanation: GOTO statement points to a label that does not exist, which will cause runtime errors
  recommendation: Create the missing label or correct the GOTO statement to point to an existing label
  checker: regex
- code: E003
  name: IF statement improper formatting
  severity: ERROR
  explanation: IF statement has improper spacing or syntax that will prevent correct execution, including a single = where == is required and a missing space before (
  recommendation: 'Use proper spacing: IF "condition" == "value" ( and IF EXIST/DEFINED/ERRORLEVEL forms without a single equals'
  checker: regex
- code: E004
  name: IF EXIST syntax mixing
  severity: ERROR
  explanation: Mixing IF EXIST syntax with comparison operators creates invalid syntax
  recommendation: Use either 'IF EXIST filename' or 'IF "variable"=="value"' but not both together
  checker: regex
- code: E005
  name: Invalid path syntax
  severity: ERROR
  explanation: Path contains invalid characters or exceeds system length limits
  recommendation: Remove invalid characters (<>|"*?) and ensure path length is under 260 characters
  checker: regex
- code: E006
  name: Potentially undefined variable reference
  severity: WARNING
  explanation: Script references variables that were never set in this script. This may be intentional
    if using environment variables, but could cause runtime errors if the variable is not set by parent
    process or system
  recommendation: If this is an environment variable, this warning can be ignored. Otherwise, define the
    variable using SET before referencing it, or add IF DEFINED checks to handle undefined cases
  checker: regex
- code: E007
  name: Empty variable check syntax error
  severity: ERROR
  explanation: Incorrect syntax for checking if variables are empty will cause comparison errors
  recommendation: 'Use IF NOT DEFINED VAR or IF "%VAR%"=="" for empty variable checks'
  checker: regex
- code: E008
  name: Unreachable code after EXIT or GOTO
  severity: ERROR
  explanation: Code after EXIT or GOTO statements will never execute
  recommendation: Remove unreachable code or restructure script logic
  checker: regex
- code: E009
  name: Mismatched quotes
  severity: ERROR
  explanation: Lines with unmatched quotes will cause syntax errors or unexpected behavior
  recommendation: Ensure all quotes are properly paired and closed
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E010
  name: Malformed FOR loop missing DO
  severity: ERROR
  explanation: FOR loops must contain the DO keyword for proper execution
  recommendation: 'Add DO keyword: FOR %%i IN (items) DO command'
  checker: regex
- code: E011
  name: Invalid variable expansion syntax
  severity: ERROR
  explanation: Variable references must use proper %VAR% or !VAR! syntax with matching delimiters
  recommendation: 'Ensure variables use matching % or ! delimiters: %VAR% for standard, !VAR! for delayed
    expansion'
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E012
  name: Missing CALL for subroutine invocation
  severity: ERROR
  explanation: Subroutines should be invoked using CALL :label_name to ensure proper return handling
  recommendation: Use CALL :subroutine_name instead of direct label jumps for subroutines
  checker: regex
- code: E013
  name: Invalid command syntax detected
  severity: ERROR
  explanation: Command appears to have typos or invalid syntax that will cause execution errors
  recommendation: 'Check command spelling and syntax: IF not IFF, ECHO not ECKO, FOR not FORx'
  checker: regex
- code: E014
  name: Missing colon in CALL statement
  severity: ERROR
  explanation: CALL statements to labels require a colon (unlike GOTO where colon is optional)
  recommendation: Use CALL :label_name with colon when calling internal subroutines
  checker: regex
- code: E015
  name: Missing colon in GOTO :EOF statement
  severity: ERROR
  explanation: GOTO :EOF requires a colon as it's a special built-in construct, not a user-defined label
  recommendation: Use GOTO :EOF (with colon) to jump to end of file
  checker: regex
- code: E016
  name: Invalid errorlevel comparison syntax
  severity: ERROR
  explanation: Invalid syntax in errorlevel comparison will cause script failure
  recommendation: 'Use proper errorlevel syntax: ''IF ERRORLEVEL n'', ''IF NOT ERRORLEVEL n'', or ''IF
    %ERRORLEVEL% operator value'''
  checker: regex
- code: E017
  name: Invalid percent-tilde syntax
  severity: ERROR
  explanation: Percent-tilde expansion syntax is malformed and will cause errors
  recommendation: 'Use correct syntax: %~n1 (name), %~f1 (full path), %~d1 (drive), %~p1 (path), %~x1
    (extension)'
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E018
  name: Unix line endings detected
  severity: ERROR
  explanation: Batch file uses Unix line endings (LF-only) which can cause GOTO/CALL label parsing failures
    and script malfunction due to Windows batch parser 512-byte boundary bugs
  recommendation: Convert file to Windows line endings (CRLF). Use tools like dos2unix, notepad++, or
    configure git with 'git config core.autocrlf true'
  checker: regex
- code: E019
  name: Percent-tilde on non-parameter variable
  severity: ERROR
  explanation: Percent-tilde syntax only works with command-line parameters (%0-%9) and FOR loop variables
  recommendation: Use percent-tilde only with %0-%9 parameters or FOR loop variables like %%i
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E020
  name: Invalid FOR loop variable syntax
  severity: ERROR
  explanation: FOR loop variables must use %% in batch files and % on command line
  recommendation: Use %%i in batch files, %i on command line for FOR loop variables
  checker: regex
- code: E021
  name: Invalid string operation syntax
  severity: ERROR
  explanation: String operations have incorrect syntax and will fail
  recommendation: 'Use correct syntax: %var:~start,length% for substring, %var:old=new% for replacement'
  checker: regex
- code: E022
  name: Invalid arithmetic expression in SET /A
  severity: ERROR
  explanation: Arithmetic expression contains invalid syntax or operators
  recommendation: 'Use valid operators: + - * / % & | ^ << >> and proper parentheses'
  checker: regex
- code: E023
  name: Missing quotes in SET /A with special characters
  severity: ERROR
  explanation: Special characters in SET /A expressions need quoting to prevent parsing errors
  recommendation: 'Quote expressions with special chars: SET /A "result=5^2" not SET /A result=5^2'
  checker: regex
- code: E024
  name: Invalid parameter modifier combination
  severity: ERROR
  explanation: Parameter modifier contains invalid or non-existent modifiers
  recommendation: 'Use valid modifiers: %~n1% (name), %~f1% (full path), %~d1% (drive), %~p1% (path),
    %~x1% (extension), %~s1% (short names), %~a1% (attributes), %~t1% (time), %~z1% (size)'
  checker: regex
- code: E025
  name: Parameter modifier on wrong context
  severity: ERROR
  explanation: Parameter modifier used in inappropriate context or with wrong variable type
  recommendation: Use parameter modifiers only with batch parameters (%1, %2, etc.) or FOR variables (%%i)
  checker: regex
- code: E027
  name: UNC path used as working directory
  severity: ERROR
  explanation: UNC paths cannot be used as working directories with CD command
  recommendation: Use PUSHD \server\share\ ... POPD pattern instead of CD for UNC paths
  checker: regex
- code: E028
  name: Complex quote escaping error
  severity: ERROR
  explanation: Complex quote patterns may not be handled correctly by the command interpreter
  recommendation: Use triple-quote pattern """text""" for quotes within quoted strings, or escape properly
    with variables
  checker: regex
- code: E029
  name: Complex SET /A expression errors
  severity: ERROR
  explanation: Arithmetic expression contains syntax errors or unbalanced operators
  recommendation: 'Check operator precedence, balance parentheses, and quote complex expressions: SET
    /A "result=(value1+value2)*3"'
  checker: regex
- code: E030
  name: Improper caret escape sequence
  severity: ERROR
  explanation: Caret character requires proper escaping when used as literal text
  recommendation: 'Use ^^ to display a single caret, or ^^^ to escape special chars: ^^^&'
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E031
  name: Invalid multilevel escaping
  severity: ERROR
  explanation: Complex multilevel escaping follows formula 2^n-1 carets for n levels
  recommendation: 'Use correct caret count: ^ (1 level), ^^^ (2 levels), ^^^^^^^ (3 levels)'
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E032
  name: Continuation character with trailing spaces
  severity: ERROR
  explanation: Spaces after caret continuation character prevent line wrapping
  recommendation: Ensure caret is last character on line with no trailing spaces
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E033
  name: Double percent escaping error
  severity: ERROR
  explanation: 'Percent signs in output require double escaping: %% instead of %'
  recommendation: Use %% in ECHO statements to display single % character
  checker: regex
  grammar_nodes:
  - commandLine
  - token
- code: E034
  name: Removed Windows command detected
  severity: ERROR
  explanation: Command has been completely removed from Windows and will not execute. These commands are
    no longer available in modern Windows versions and will cause script failures
  recommendation: 'Replace removed commands with modern alternatives: ASSIGN (removed - use drive mounting with
    modern tools), BACKUP (removed - use wbadmin or modern backup tools), DISKCOMP (removed - use FC for
    file comparison), APPEND (removed - modify PATH or use full paths), BROWSTAT (removed - use NET VIEW
    or PowerShell), EDLIN (removed - use modern text editors), GRAFTABL (removed - use modern code-page
    handling), INUSE (removed - use HANDLE.EXE from Sysinternals), JOIN (removed - use drive mounting with
    modern tools), NET PRINT (removed - use PowerShell Print cmdlets), DISKCOPY (removed - use ROBOCOPY or
    XCOPY), STREAMS (removed - use Get-Item -Stream in PowerShell)'
  checker: regex
- code: E035
  name: Smart quote characters in batch source
  severity: ERROR
  explanation: Curly/smart quotation marks from word processors are not valid batch string delimiters
  recommendation: Replace Unicode curly quotes (U+201C/U+201D) with straight ASCII double quotes
  checker: regex
  examples:
    bad:
      - 'echo “hello”'
    good:
      - 'echo "hello"'
- code: E036
  name: IF EXISTS typo
  severity: ERROR
  explanation: cmd.exe accepts IF EXIST, not IF EXISTS; the trailing S causes a syntax error at runtime
  recommendation: Use IF EXIST filename or IF NOT EXIST filename per IF /?
  checker: regex
  examples:
    bad:
      - IF EXISTS file.txt echo found
      - IF NOT EXISTS file.txt echo missing
      - IF EXIT file.txt echo found
      - IF EXITS file.txt echo found
    good:
      - IF EXIST file.txt echo found
      - IF NOT EXIST file.txt echo missing
- code: E037
  name: FOR /F eol option has multiple characters
  severity: ERROR
  explanation: The FOR /F eol= option accepts only a single end-of-line comment character per FOR /?; additional characters cause a cmd.exe syntax error
  recommendation: Use eol= with exactly one character (for example eol=; or eol=#)
  checker: regex
  examples:
    bad:
      - for /f "eol=XY tokens=1" %%a in (data.txt) do echo %%a
    good:
      - for /f "eol=; tokens=1" %%a in (data.txt) do echo %%a
- code: E038
  name: FOR /F invalid skip or tokens suboption
  severity: ERROR
  explanation: FOR /F skip= must be a positive integer (1 or greater) and tokens= ranges must be ascending per FOR /?; invalid values cause cmd.exe syntax errors at parse time
  recommendation: Use skip=1 or higher for header lines; use ascending token ranges such as tokens=1-5 or tokens=2,4
  checker: regex
  examples:
    bad:
      - for /f "skip=0 tokens=1" %%a in (data.txt) do echo %%a
      - for /f "skip=abc tokens=1" %%a in (data.txt) do echo %%a
      - for /f "tokens=5-2" %%a in ("a b") do echo %%a
    good:
      - for /f "skip=1 tokens=1" %%a in (data.txt) do echo %%a
      - for /f "tokens=1-5" %%a in (data.txt) do echo %%a
- code: E039
  name: IF block parenthesis must be on same line
  severity: ERROR
  explanation: In cmd.exe the open parenthesis of an IF block must appear on the same line as the IF condition; placing it on the next line causes a syntax error
  recommendation: Put the opening parenthesis on the IF line, for example IF 1==1 (echo ok)
  checker: regex
  examples:
    bad:
      - |-
        if 1==1
        (echo bad)
    good:
      - if 1==1 (echo ok)
- code: E040
  name: FOR block parenthesis must be on same line as DO
  severity: ERROR
  explanation: In cmd.exe the open parenthesis of a FOR block must appear on the same line as the DO keyword; placing it on the next line causes a syntax error
  recommendation: Put the opening parenthesis on the FOR line after DO, for example FOR %%a IN (1) DO (echo ok)
  checker: regex
  examples:
    bad:
      - |-
        for %%a in (1) do
        (echo bad)
    good:
      - for %%a in (1) do (echo ok)
- code: E041
  name: SET /P missing variable assignment
  severity: ERROR
  explanation: SET /P requires variable=[promptString] per SET /?; a prompt-only quoted string without a variable name causes a cmd.exe syntax error
  recommendation: Use SET /P var=Prompt or SET /P "var=Prompt text" before reading user input
  checker: regex
  examples:
    bad:
      - 'set /p "Enter your name: "'
    good:
      - set /p name=Enter your name
      - 'set /p "name=Enter your name: "'
- code: E042
  name: Text after closing parenthesis in block
  severity: ERROR
  explanation: Inside a parenthesized block, cmd.exe treats an unquoted closing parenthesis
    as the end of a command group; leftover text is then parsed as a new command and
    causes a syntax error (exit 255)
  recommendation: Escape parentheses as ^(...^), quote the text, or remove the trailing
    text after the closing parenthesis
  checker: regex
  examples:
    bad:
      - |-
        for %%D in (C) do (
            echo --- text (parens) ---
        )
    good:
      - |-
        for %%D in (C) do (
            echo text (parens)
        )
      - |-
        for %%D in (C) do (
            echo --- text ^(parens^) ---
        )
- code: E043
  name: Double-colon comment inside parenthesized block
  severity: ERROR
  explanation: 'Inside a parenthesized block, cmd.exe treats :: as a label rather than a comment; labels in blocks break block parsing'
  recommendation: Use REM for comments inside IF/FOR parenthesized blocks
  checker: regex
  examples:
    bad:
      - |-
        if 1==1 (
          :: do not comment like this
          echo ok
        )
    good:
      - |-
        if 1==1 (
          REM use rem inside blocks
          echo ok
        )
- code: E044
  name: ELSE on a new line
  severity: ERROR
  explanation: ELSE must share the line with the closing parenthesis of the IF block; an ELSE that starts a new line is not paired and runs with silent wrong control flow
  recommendation: 'Write ) ELSE ( on the same line as the close of the IF block'
  checker: regex
  examples:
    bad:
      - |-
        if 1==1 (
          echo yes
        )
        else (
          echo no
        )
    good:
      - |-
        if 1==1 (
          echo yes
        ) else (
          echo no
        )
- code: E045
  name: Invalid internal command switch or argument
  severity: ERROR
  explanation: Several cmd.exe internal commands accept only a documented set of slash-switches or no arguments at all; unknown switches and extra arguments fail at runtime
  recommendation: Use only documented switches (for example IF /I, CD /D, SET /A /P, EXIT /B, FOR /D /F /L /R, DATE /T, TIME /T, SHIFT /0-/8) and omit arguments for CLS, PAUSE, VER, POPD, and ENDLOCAL
  checker: regex
  examples:
    bad:
      - IF /X 1==1 echo bad
      - FOR /Q %%i IN (1) DO echo %%i
      - CLS extra
    good:
      - IF /I 1==1 echo ok
      - FOR /L %%i IN (1,1,1) DO echo %%i
      - CLS
- code: E046
  name: Malformed stream redirection
  severity: ERROR
  explanation: 'Merging stderr and stdout requires 2>&1 or 1>&2; a space before & (2> &1) is a live syntax error. 2>>&1 is valid append-duplication'
  recommendation: 'Write 2>&1 or 1>&2 with no space before &, and place 2>&1 at the end of the command'
  checker: regex
  examples:
    bad:
      - DIR 2> &1
    good:
      - DIR >log.txt 2>&1
      - DIR 2>>&1
- code: E047
  name: Unescaped specials in FOR /F command or ECHO in a block
  severity: ERROR
  explanation: 'Unescaped & < > | inside a FOR /F IN (''command'') string, or an unescaped ) in ECHO inside a parenthesized block, terminate the loop or block early. An opening parenthesis in ECHO text does not end the block'
  recommendation: 'Escape as ^& ^< ^> ^| inside FOR /F, and escape a closing parenthesis in ECHO as ^)'
  checker: regex
  examples:
    bad:
      - for /f %%a in ('dir /b | sort') do echo %%a
      - |-
        if 1==1 (
          echo text (parens)
        )
    good:
      - for /f %%a in ('dir /b ^| sort') do echo %%a
      - |-
        if 1==1 (
          echo text ^(parens^)
        )
      - |-
        if 1==1 (
          echo if ($x -eq 1^) { y }
        )
- code: E048
  name: Line exceeds maximum length
  severity: ERROR
  explanation: 'cmd.exe rejects lines longer than about 8191 characters. Blinter reports a line over 10000 characters as an error and skips that line so the rest of the file is still linted'
  recommendation: 'Split the line with a caret continuation or move the text into a called script'
  checker: regex
  examples:
    bad:
      - A line longer than 10000 characters
    good:
      - echo short line
- code: P001
  name: Redundant file existence check
  severity: PERFORMANCE
  explanation: Unnecessary repeated file existence checks reduce script performance
  recommendation: Combine existence checks or store result in variable for reuse
  checker: regex
- code: P002
  name: Code duplication detected
  severity: PERFORMANCE
  explanation: Repeated code blocks should be refactored into subroutines for better maintainability
  recommendation: Create subroutines using CALL :function_name for repeated code
  checker: regex
- code: P003
  name: Unnecessary SETLOCAL
  severity: PERFORMANCE
  explanation: SETLOCAL is not needed if there are no SET commands in the script
  recommendation: Remove SETLOCAL if no local variables are set
  checker: regex
- code: P004
  name: Unnecessary ENABLEDELAYEDEXPANSION
  severity: PERFORMANCE
  explanation: ENABLEDELAYEDEXPANSION is not needed if no !VARIABLES! are used
  recommendation: Remove ENABLEDELAYEDEXPANSION if delayed expansion is not used
  checker: regex
- code: P005
  name: ENDLOCAL without SETLOCAL
  severity: PERFORMANCE
  explanation: ENDLOCAL is not needed without a corresponding SETLOCAL
  recommendation: Remove unnecessary ENDLOCAL commands
  checker: regex
- code: P006
  name: Missing ENDLOCAL before exit
  severity: PERFORMANCE
  explanation: SETLOCAL should be paired with ENDLOCAL before every exit point
  recommendation: Add ENDLOCAL before all EXIT statements when SETLOCAL is used
  checker: regex
- code: P007
  name: Temporary file without random name
  severity: PERFORMANCE
  explanation: Temporary files should use %%RANDOM%% to prevent file collisions
  recommendation: 'Use %%RANDOM%% in temporary filenames: temp_%%RANDOM%%.txt'
  checker: regex
- code: P008
  name: Delayed expansion without enablement
  severity: PERFORMANCE
  explanation: Using !VARIABLES! requires SETLOCAL ENABLEDELAYEDEXPANSION for proper functionality
  recommendation: Add SETLOCAL ENABLEDELAYEDEXPANSION before using !variable! syntax
  checker: regex
- code: P009
  name: Inefficient FOR loop pattern
  severity: PERFORMANCE
  explanation: FOR /F defaults to tokens=1; when the entire line is needed, omitting tokens=* parses only the first token
  recommendation: 'Use ''tokens=*'' when the whole line is required: FOR /F "tokens=*" %%i'
  checker: regex
- code: P010
  name: DIR without /B when output is processed
  severity: PERFORMANCE
  explanation: DIR without /B produces verbose multi-column output that is inefficient to parse when redirected or piped
  recommendation: 'Use DIR /B for bare filename output when piping or redirecting: DIR /B | findstr txt'
  checker: regex
- code: P012
  name: Inefficient string operations
  severity: PERFORMANCE
  explanation: Multiple string operations on same variable can be combined
  recommendation: 'Combine operations: %var:~0,5:old=new% instead of multiple assignments'
  checker: regex
- code: P013
  name: Missing /B flag for large DIR operations
  severity: PERFORMANCE
  explanation: DIR without /B produces verbose output that may be inefficient
  recommendation: Use DIR /B for bare format when only filenames are needed
  checker: regex
- code: P014
  name: Unnecessary command output
  severity: PERFORMANCE
  explanation: Commands producing unwanted output should be redirected to improve performance
  recommendation: 'Redirect unwanted output: command >nul 2>&1'
  checker: regex
- code: P015
  name: Inefficient delay implementation
  severity: PERFORMANCE
  explanation: Using ping localhost or choice for delays is inefficient on modern Windows
  recommendation: Use TIMEOUT command for Vista+ or implement proper delay alternatives for older systems
  checker: regex
- code: P016
  name: Inefficient string concatenation in loops
  severity: PERFORMANCE
  explanation: String concatenation inside loops creates performance bottlenecks
  recommendation: Use arrays or temporary files for large string operations in loops
  checker: regex
- code: P017
  name: Repeated file existence checks
  severity: PERFORMANCE
  explanation: Multiple IF EXIST checks on the same file waste I/O operations
  recommendation: Store file existence result in variable for reuse
  checker: regex
- code: P018
  name: Inefficient directory traversal
  severity: PERFORMANCE
  explanation: FOR /R without specific file masks processes unnecessary files
  recommendation: Use specific file masks in FOR /R to reduce processing overhead
  checker: regex
- code: P019
  name: Excessive variable expansion in loops
  severity: PERFORMANCE
  explanation: Complex variable expansion inside tight loops impacts performance
  recommendation: Pre-calculate complex variables before loop entry
  checker: regex
- code: P020
  name: Redundant command echoing suppression
  severity: PERFORMANCE
  explanation: Multiple @ECHO OFF commands or redundant @ prefixes waste processing
  recommendation: Use single @ECHO OFF at script start, avoid @ on subsequent commands
  checker: regex
- code: P021
  name: Inefficient process checking pattern
  severity: PERFORMANCE
  explanation: Repeated TASKLIST calls without filters are resource-intensive
  recommendation: Use TASKLIST /FI filters to reduce output and processing time
  checker: regex
- code: P022
  name: Unnecessary output redirection in loops
  severity: PERFORMANCE
  explanation: Redirecting output inside loops creates I/O overhead
  recommendation: Collect output in variable and redirect once after loop completion
  checker: regex
- code: P023
  name: Inefficient arithmetic operations
  severity: PERFORMANCE
  explanation: Complex arithmetic in SET /A can be optimized with intermediate variables
  recommendation: Break complex expressions into steps with intermediate variables
  checker: regex
- code: P024
  name: Redundant SETLOCAL/ENDLOCAL pairs
  severity: PERFORMANCE
  explanation: Multiple SETLOCAL/ENDLOCAL pairs create unnecessary scope overhead
  recommendation: Use single SETLOCAL at script start with ENDLOCAL at end
  checker: regex
- code: P025
  name: Inefficient wildcard usage in file operations
  severity: PERFORMANCE
  explanation: Overly broad wildcards (*.*) process unnecessary files
  recommendation: 'Use specific file extensions: *.txt instead of *.*'
  checker: regex
- code: P026
  name: Redundant DISABLEDELAYEDEXPANSION
  severity: PERFORMANCE
  explanation: Delayed expansion is disabled by default in batch scripts, so explicit disablement is usually
    redundant unless ensuring a known state from parent scripts or protecting literal ! characters
  recommendation: 'Remove unless: 1) After ENDLOCAL (toggling pattern), 2) Protecting literal ! in strings,
    or 3) Defensive programming at script start'
  checker: regex
- code: P027
  name: SETLOCAL nesting exceeds recommended depth
  severity: PERFORMANCE
  explanation: cmd.exe supports at most 32 nested SETLOCAL scopes; deep nesting risks runtime failure
  recommendation: Flatten scope with fewer SETLOCAL/ENDLOCAL pairs or refactor into subroutines
  checker: regex
- code: S001
  name: Missing @ECHO OFF at file start
  severity: STYLE
  explanation: Batch scripts usually start with @ECHO OFF to prevent command echoing during execution
  recommendation: Add '@ECHO OFF' as the first line of your script
  checker: regex
- code: S002
  name: ECHO OFF without @ prefix
  severity: STYLE
  explanation: ECHO OFF should use @ prefix to prevent the command itself from being displayed
  recommendation: Use '@ECHO OFF' instead of 'ECHO OFF'
  checker: regex
- code: S003
  name: Inconsistent command capitalization
  severity: STYLE
  explanation: Batch commands should follow consistent casing conventions within the same file for readability
  recommendation: Use consistent casing for batch commands throughout the file (either uppercase or lowercase)
  checker: regex
- code: S004
  name: Trailing whitespace
  severity: STYLE
  explanation: Trailing spaces at line end can cause subtle errors and should be removed
  recommendation: Remove trailing spaces and tabs from line endings
  checker: regex
- code: S005
  name: Mixed line endings
  severity: STYLE
  explanation: File contains mixed line ending types (CRLF and LF) which can cause parsing inconsistencies
  recommendation: Use consistent CRLF line endings throughout the file for Windows batch files
  checker: regex
- code: S007
  name: BAT extension used instead of CMD for newer Windows
  severity: STYLE
  explanation: The .cmd file extension is recommended over .bat for Windows NT and newer versions (Windows
    2000+). CMD files support additional features and have better error handling in newer Windows environments
  recommendation: Consider renaming .bat files to .cmd for scripts intended for Windows 2000 and newer
